<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>运营后台 · 盲盒商城（精简开源版）</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="sidebar">
      <div class="brand">盲盒<span class="accent">星球</span> 后台</div>
      <div class="side-link active" data-view="dashboard">仪表盘</div>
      <div class="side-link" data-view="series">系列管理</div>
      <div class="side-link" data-view="prizes">概率与库存</div>
      <div class="side-link" data-view="records">抽取记录</div>
      <div class="side-link" id="btnResetData" style="margin-top:20px;color:var(--red)">重置示例数据</div>
      <a href="index.html" class="side-link">← 返回前台</a>
    </aside>

    <main class="admin-main">
      <section id="view-dashboard" class="admin-view active">
        <div class="page-head"><h1>仪表盘</h1><p>系列、抽取与收入概览（真实数据，非模拟）。</p></div>
        <div class="stat-grid" id="statGrid"></div>
        <div class="panel">
          <h3>按稀有度统计抽取次数</h3>
          <div id="tierStats" class="tier-stats"></div>
        </div>
        <table>
          <thead><tr><th>最新抽取</th><th>系列</th><th>奖品</th><th>类型</th><th>时间</th></tr></thead>
          <tbody id="recentDrawsBody"></tbody>
        </table>
      </section>

      <section id="view-series" class="admin-view">
        <div class="page-head"><h1>系列管理</h1><p>新增、编辑或删除盲盒系列。删除会级联删除该系列的奖品与抽取记录。</p></div>
        <div class="table-toolbar">
          <span></span>
          <button class="btn btn-primary btn-sm" id="btnAddSeries">+ 新增系列</button>
        </div>
        <table>
          <thead><tr><th>系列</th><th>单价</th><th>奖品数</th><th>剩余总库存</th><th>操作</th></tr></thead>
          <tbody id="seriesBody"></tbody>
        </table>
      </section>

      <section id="view-prizes" class="admin-view">
        <div class="page-head"><h1>概率与库存</h1><p>管理某个系列的奖品概率与库存。保存时会校验该系列所有奖品概率之和必须<strong>正好等于 100%</strong>。</p></div>
        <div class="table-toolbar">
          <div class="field" style="margin:0;min-width:240px">
            <label>选择系列</label>
            <select id="prizeSeriesSelect"></select>
          </div>
          <button class="btn btn-primary btn-sm" id="btnAddPrize">+ 新增奖品</button>
        </div>
        <div id="probSumBanner" class="prob-sum-banner"></div>
        <table>
          <thead><tr><th>奖品</th><th>类型</th><th>概率</th><th>剩余库存</th><th>操作</th></tr></thead>
          <tbody id="prizesBody"></tbody>
        </table>
      </section>

      <section id="view-records" class="admin-view">
        <div class="page-head"><h1>抽取记录</h1><p>全部抽取历史，可按系列筛选。</p></div>
        <div class="table-toolbar">
          <div class="field" style="margin:0;min-width:240px">
            <label>按系列筛选</label>
            <select id="recordSeriesFilter"></select>
          </div>
          <span></span>
        </div>
        <table>
          <thead><tr><th>系列</th><th>奖品</th><th>类型</th><th>买家</th><th>时间</th></tr></thead>
          <tbody id="recordsBody"></tbody>
        </table>
      </section>
    </main>
  </div>

  <!-- 系列 modal -->
  <div class="modal-backdrop" id="seriesModalBackdrop">
    <div class="modal">
      <button class="modal-close" id="btnCloseSeriesModal">&times;</button>
      <h2 id="seriesModalTitle">新增系列</h2>
      <div id="seriesModalMsg"></div>
      <form id="seriesForm" novalidate>
        <input type="hidden" id="seriesIdInput">
        <div class="field"><label>系列名称</label><input id="seriesNameInput" type="text" required></div>
        <div class="field-row">
          <div class="field"><label>单价（元/次）</label><input id="seriesPriceInput" type="number" min="0" step="0.01" required></div>
          <div class="field"><label>封面图标（Emoji）</label><input id="seriesEmojiInput" type="text" maxlength="4" required></div>
        </div>
        <div class="field"><label>简介</label><textarea id="seriesDescInput" rows="3"></textarea></div>
        <button type="submit" class="btn btn-primary btn-block">保存</button>
      </form>
    </div>
  </div>

  <!-- 奖品 modal -->
  <div class="modal-backdrop" id="prizeModalBackdrop">
    <div class="modal">
      <button class="modal-close" id="btnClosePrizeModal">&times;</button>
      <h2 id="prizeModalTitle">新增奖品</h2>
      <div id="prizeModalMsg"></div>
      <form id="prizeForm" novalidate>
        <input type="hidden" id="prizeIdInput">
        <div class="field"><label>奖品名称</label><input id="prizeNameInput" type="text" required></div>
        <div class="field-row">
          <div class="field">
            <label>类型</label>
            <select id="prizeTierInput">
              <option value="普通">普通</option>
              <option value="稀有">稀有</option>
              <option value="隐藏">隐藏</option>
            </select>
          </div>
          <div class="field"><label>概率（%）</label><input id="prizeProbInput" type="number" min="0" max="100" step="0.01" required></div>
        </div>
        <div class="field"><label>剩余库存（件）</label><input id="prizeStockInput" type="number" min="0" step="1" required></div>
        <button type="submit" class="btn btn-primary btn-block">保存</button>
      </form>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="admin.js"></script>

<footer style="margin:40px auto 16px;max-width:1100px;padding:16px 20px 0;border-top:1px solid var(--line,rgba(147,160,184,.18));text-align:center;color:var(--muted,#93A0B8);font-size:13px">精简开源演示 &middot; 完整版：<a href="https://inzyxuashop.com/manghe-yuanma.html" target="_blank" rel="noopener" style="color:var(--cyan,#19B8D4);text-decoration:none">盲盒商城系统源码</a></footer>
</body>
</html>
