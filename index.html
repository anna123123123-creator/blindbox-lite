<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>盲盒商城（精简开源版）</title>
<meta name="description" content="免费开源的盲盒商城系统精简版：系列浏览、概率与库存公示透明、真实余额扣费与库存感知抽取、我的战利品记录，后台系列与概率库存管理，真实增删改查功能，纯前端+localStorage实现，可作为学习或二次开发起点。">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">盲盒<span class="accent">星球</span></div>
    <div class="topbar-right">
      <div class="buyer-field">
        <label for="buyerNameInput">当前买家</label>
        <input id="buyerNameInput" type="text" value="">
      </div>
      <div class="balance-badge" id="balanceBadge">余额 ¥0</div>
      <a href="admin.html" class="nav-link">进入运营后台 →</a>
    </div>
  </header>

  <main class="container">
    <div class="page-head">
      <h1>拆一个惊喜盒子</h1>
      <p>所有系列的中奖概率与剩余库存<strong>全程公示、随时可查</strong>——这是国家对盲盒商家的强制要求，我们也在这个真实可用的精简开源系统里如实实现：每次抽取都是基于公示概率、在有库存的奖品范围内加权随机产生，不是抽卡宣传图。数据保存在你浏览器本地。</p>
    </div>
    <div id="seriesGrid" class="series-grid"></div>

    <section class="loot-section">
      <div class="page-head" style="margin-top:36px">
        <h2>我的战利品</h2>
        <p>按抽取时间倒序显示，共 <span id="lootCount">0</span> 件。</p>
      </div>
      <div id="lootList" class="loot-list"></div>
    </section>
  </main>

  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal modal-wide">
      <button class="modal-close" id="btnCloseModal">&times;</button>
      <h2 id="modalSeriesName"></h2>
      <p class="sub" id="modalSeriesDesc"></p>

      <table class="prize-table" id="prizeTable">
        <thead><tr><th>奖品</th><th>类型</th><th>概率</th><th>剩余库存</th></tr></thead>
        <tbody id="prizeTableBody"></tbody>
      </table>
      <div class="prob-sum-note" id="probSumNote"></div>

      <div id="modalMsg"></div>
      <div id="revealResult" class="reveal-result" style="display:none"></div>

      <form id="drawForm" novalidate>
        <button type="submit" class="btn btn-primary btn-block" id="btnDraw">抽一个（¥<span id="drawPriceLabel">0</span>）</button>
      </form>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="script.js"></script>

<footer style="margin:40px auto 16px;max-width:1100px;padding:16px 20px 0;border-top:1px solid var(--line,rgba(147,160,184,.18));text-align:center;color:var(--muted,#93A0B8);font-size:13px">精简开源演示 &middot; 完整版：<a href="https://inzyxuashop.com/manghe-yuanma.html" target="_blank" rel="noopener" style="color:var(--cyan,#19B8D4);text-decoration:none">盲盒商城系统源码</a></footer>
</body>
</html>
